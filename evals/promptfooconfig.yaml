description: recs-files evals

prompts:
  - '{{request}}'

providers:
  - id: file://providers/pi.js
    label: claude-sonnet-5.5 with-skills
    config:
      model: openrouter/anthropic/claude-sonnet-5.5
      skills: true
  - id: file://providers/pi.js
    label: claude-sonnet-5.5 without-skills
    config:
      model: openrouter/anthropic/claude-sonnet-5.5
      skills: false
  - id: file://providers/pi.js
    label: gpt-5.5 with-skills
    config:
      model: openrouter/openai/gpt-5.5
      skills: true
  - id: file://providers/pi.js
    label: gpt-5.5 without-skills
    config:
      model: openrouter/openai/gpt-5.5
      skills: false
  - id: file://providers/pi.js
    label: gemini-3.1-pro with-skills
    config:
      model: openrouter/google/gemini-3.1-pro-preview
      skills: true
  - id: file://providers/pi.js
    label: gemini-3.1-pro without-skills
    config:
      model: openrouter/google/gemini-3.1-pro-preview
      skills: false
  - id: file://providers/pi.js
    label: qwen3.8-max with-skills
    config:
      model: openrouter/qwen/qwen3.8-max-0902
      skills: true
  - id: file://providers/pi.js
    label: qwen3.8-max without-skills
    config:
      model: openrouter/qwen/qwen3.8-max-0902
      skills: false
  - id: file://providers/claude.js
    label: claude-code-sonnet with-skills
    config:
      model: claude-sonnet-5-5
      skills: true
  - id: file://providers/claude.js
    label: claude-code-sonnet without-skills
    config:
      model: claude-sonnet-5-5
      skills: false

tests:
  - description: The record keeper rejects a proposed record
    vars:
      case: rejecting-a-proposed-record
      request: file://cases/rejecting-a-proposed-record/prompt.md
    assert:
      # F-20261026-tacr §8: A record is written with its identifier and its line in its projection
      - type: javascript
        metric: rejected line removed
        value: file://checks/rejecting-a-proposed-record.js:lineRemoved
      # F-20261014-pbwk §5: A record change is agreed before it stands
      - type: javascript
        metric: marked rejected
        value: file://checks/rejecting-a-proposed-record.js:markedRejected
      # UL-20261015-fdb5: Rejected
      - type: javascript
        metric: text stands
        value: file://checks/rejecting-a-proposed-record.js:textStands
      # F-20261014-pbwk §5: A record change is agreed before it stands
      - type: javascript
        metric: nothing else written
        value: file://checks/rejecting-a-proposed-record.js:nothingElseWritten
      # F-20261026-tacr §8: A record is written with its identifier and its line in its projection
      - type: javascript
        metric: other lines kept
        value: file://checks/rejecting-a-proposed-record.js:otherLinesKept
      # ADR-20261015-70tz: A record change is one commit of its own
      - type: javascript
        metric: committed alone
        value: file://checks/rejecting-a-proposed-record.js:committedAlone
      - type: javascript
        metric: skill use
        value: file://checks/skill-use.js:writingRecords
      # ADR-20261015-0v6s §Consequences: Records are written in org
      - type: javascript
        metric: org lines whole
        value: file://checks/org-lines.js:linesWhole
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: records referred to by links
        value: file://checks/org-lines.js:namesByLink
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: links resolve
        value: file://checks/org-lines.js:linksResolve

  - description: The record keeper asks for a record
    vars:
      case: proposing-a-record
      request: file://cases/proposing-a-record/prompt.md
    assert:
      # F-20261026-tacr §2: A record is written with its identifier and its line in its projection
      - type: javascript
        metric: identifier from the date and four characters
        value: file://checks/proposing-a-record.js:identifierFromDateAndCharacters
      # F-20261026-tacr §1: A record is written with its identifier and its line in its projection
      # F-20261014-pbwk §1: A record change is agreed before it stands
      - type: javascript
        metric: written as proposed
        value: file://checks/proposing-a-record.js:writtenAsProposed
      # F-20261026-tacr §1: A record is written with its identifier and its line in its projection
      - type: javascript
        metric: listed under proposed
        value: file://checks/proposing-a-record.js:listedUnderProposed
      # F-20261026-tacr §4: A record is written with its identifier and its line in its projection
      - type: javascript
        metric: same title
        value: file://checks/proposing-a-record.js:sameTitle
      # F-20261014-pbwk §1: A record change is agreed before it stands
      - type: javascript
        metric: nothing else written
        value: file://checks/proposing-a-record.js:nothingElseWritten
      # ADR-20261015-70tz: A record change is one commit of its own
      - type: javascript
        metric: committed alone
        value: file://checks/proposing-a-record.js:committedAlone
      # UW-20261014-8c8f 4: Create a record
      # F-20261014-pbwk §3: A record change is agreed before it stands
      - type: llm-rubric
        metric: shows the draft for agreement
        provider: anthropic:messages:claude-sonnet-5-5
        value: >-
          The reply shows the record keeper the drafted decision record, or
          says where it is, and asks the record keeper to agree to it or
          change it. A reply that reports the decision as recorded and
          standing, with nothing left for the record keeper to agree to,
          fails.
      # UW-20261014-8c8f 4: Create a record
      # F-20261014-cjkm §1: Falsified sentences are found with their replacements
      # F-20261014-cjkm §4: Falsified sentences are found with their replacements
      - type: llm-rubric
        metric: shows the falsified sentence
        provider: anthropic:messages:claude-sonnet-5-5
        value: >-
          The reply points out that the vision says an inspection's time is
          "stored as the local time it was taken", which the new decision
          contradicts, and proposes wording to replace that sentence. A reply
          that does not mention the vision's sentence, or says it has already
          changed the vision, fails.
      - type: javascript
        metric: skill use
        value: file://checks/skill-use.js:writingRecords
      # ADR-20261015-0v6s §Consequences: Records are written in org
      - type: javascript
        metric: org lines whole
        value: file://checks/org-lines.js:linesWhole
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: records referred to by links
        value: file://checks/org-lines.js:namesByLink
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: links resolve
        value: file://checks/org-lines.js:linksResolve

  - description: The record keeper replaces two features with one
    vars:
      case: superseding-two-features
      request: file://cases/superseding-two-features/prompt.md
    assert:
      # F-20261026-tacr §1: A record is written with its identifier and its line in its projection
      # F-20261014-pbwk §1: A record change is agreed before it stands
      - type: javascript
        metric: written as proposed
        value: file://checks/superseding-two-features.js:writtenAsProposed
      # F-20261027-jtb9 §2: A superseded record refers to its successor
      # ADR-20261026-y9zt §Consequences: A record refers to another record by an org link to its file
      - type: javascript
        metric: supersedes both by link
        value: file://checks/superseding-two-features.js:supersedesBothByLink
      # ADR-20261026-y9zt §Consequences: A record refers to another record by an org link to its file
      - type: javascript
        metric: links parted by a comma
        value: file://checks/superseding-two-features.js:linksParted
      # F-20261027-jtb9 §2: A superseded record refers to its successor
      # ADR-20261026-y9zt §Consequences: A record refers to another record by an org link to its file
      - type: javascript
        metric: supersedes by links only
        value: file://checks/superseding-two-features.js:linksOnly
      # ADR-20261015-0v6s §Consequences: Records are written in org
      - type: javascript
        metric: org lines whole
        value: file://checks/org-lines.js:linesWhole
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: records referred to by links
        value: file://checks/org-lines.js:namesByLink
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: links resolve
        value: file://checks/org-lines.js:linksResolve
      - type: javascript
        metric: skill use
        value: file://checks/skill-use.js:writingRecords

  - description: A change is asked for where AGENTS.md names no realization modality
    vars:
      case: choosing-a-realization-modality
      request: file://cases/choosing-a-realization-modality/prompt.md
    assert:
      # F-20261015-38qf §1: The record keeper chooses a project's realization modalities
      - type: llm-rubric
        metric: asks for a modality
        provider: anthropic:messages:claude-sonnet-5-5
        value: >-
          The reply asks the record keeper to choose what form the project's
          realization takes, such as code or something else, before any work
          on it. Asking only how the feature should behave, or assuming code
          without asking, fails.
      # F-20261015-38qf §1: The record keeper chooses a project's realization modalities
      # F-20261015-38qf §3: The record keeper chooses a project's realization modalities
      - type: javascript
        metric: realization untouched
        value: file://checks/choosing-a-realization-modality.js:realizationUntouched
      # F-20261015-38qf §2: The record keeper chooses a project's realization modalities
      - type: javascript
        metric: no modality named
        value: file://checks/choosing-a-realization-modality.js:noModalityNamed
      # F-20261014-pbwk §1: A record change is agreed before it stands
      - type: javascript
        metric: no record stands
        value: file://checks/choosing-a-realization-modality.js:noRecordStands

  - description: A plan is asked for where AGENTS.md names no realization modality
    vars:
      case: planning-without-a-realization-modality
      request: file://cases/planning-without-a-realization-modality/prompt.md
    assert:
      # F-20261015-38qf §1: The record keeper chooses a project's realization modalities
      - type: llm-rubric
        metric: asks for a modality
        provider: anthropic:messages:claude-sonnet-5-5
        value: >-
          The reply asks the record keeper to choose what form the project's
          realization takes, such as code or something else, before any work
          on it. Asking only how the feature should behave, or assuming code
          without asking, fails.
      # UW-20261015-nkb5 2a: Realize a change to the system
      # F-20261015-38qf §1: The record keeper chooses a project's realization modalities
      - type: javascript
        metric: no plan written
        value: file://checks/choosing-a-realization-modality.js:nothingWritten

  - description: Records are started for a project whose AGENTS.md names no realization modality
    vars:
      case: starting-records-from-a-realization
      request: file://cases/starting-records-from-a-realization/prompt.md
    assert:
      # UW-20261015-nqdn 3: Start a project's records from its realization
      # F-20261015-38qf §1: The record keeper chooses a project's realization modalities
      - type: llm-rubric
        metric: asks for a modality
        provider: anthropic:messages:claude-sonnet-5-5
        value: >-
          The reply asks the record keeper to choose what form the project's
          realization takes, such as code or something else, and asks it
          before any question about the domain, its users or its workflows.
          Assuming code because the project holds code, or asking about the
          domain first, fails.
      # UW-20261015-nqdn: Start a project's records from its realization
      - type: javascript
        metric: nothing written
        value: file://checks/choosing-a-realization-modality.js:nothingWritten
      - type: javascript
        metric: skill use
        value: file://checks/skill-use.js:kickstart
      # ADR-20261015-0v6s §Consequences: Records are written in org
      - type: javascript
        metric: org lines whole
        value: file://checks/org-lines.js:linesWhole
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: records referred to by links
        value: file://checks/org-lines.js:namesByLink
      # ADR-20261026-y9zt §Decision: A record refers to another record by an org link to its file
      - type: javascript
        metric: links resolve
        value: file://checks/org-lines.js:linksResolve

  - description: "The agent cites records to the record keeper (train: paused-on-a-contradiction)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/paused-on-a-contradiction.md
    assert: &citing-records-checks
      - type: javascript
        metric: cites records
        value: file://checks/citing-records.js:citesRecords
      # F-20261028-1mkt §1: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: exact titles
        value: file://checks/citing-records.js:exactTitles
      # F-20261028-1mkt §2, §3: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: again by citation or title
        value: file://checks/citing-records.js:againByCitationOrTitle
      # F-20261028-1mkt §4: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: sections first cited
        value: file://checks/citing-records.js:sectionsFirstCited
      # F-20261028-1mkt §5: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: section before title
        value: file://checks/citing-records.js:sectionBeforeTitle
      # F-20261028-1mkt §5: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: sections in one citation
        value: file://checks/citing-records.js:sectionsInOneCitation
      # F-20261028-1mkt §5: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: sections in record order
        value: file://checks/citing-records.js:sectionsInRecordOrder
      # F-20261028-1mkt §6: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: sections listed under their citation
        value: file://checks/citing-records.js:sectionsListedUnder
      # F-20261028-1mkt §9: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: no sections of a record not on disk
        value: file://checks/citing-records.js:noSectionsOfARecordNotOnDisk
      # F-20261028-1mkt §10: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: quotes in code blocks
        value: file://checks/citing-records.js:quotesInCodeBlocks
      # F-20261028-1mkt §7: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: in backticks
        value: file://checks/citing-records.js:inBackticks
      # F-20261028-1mkt §8: The agent cites a record the first time a reply refers to it, says beneath it what each cited section says, then refers to it again by its title
      - type: javascript
        metric: one line
        value: file://checks/citing-records.js:oneLine
  - description: "The agent cites records to the record keeper (train: a-word-used-two-ways)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/a-word-used-two-ways.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (train: drafting-a-sentence)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/drafting-a-sentence.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (train: choosing-a-renewal-limit)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/choosing-a-renewal-limit.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (train: framing-a-complaint)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/framing-a-complaint.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (train: listing-the-refusals)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/listing-the-refusals.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (train: quoting-a-requirement)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/quoting-a-requirement.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (held-out: counting-renewals)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/counting-renewals.md
    assert: *citing-records-checks
  - description: "The agent cites records to the record keeper (held-out: releasing-a-held-copy)"
    vars:
      case: citing-records-to-the-record-keeper
      request: file://cases/citing-records-to-the-record-keeper/prompts/releasing-a-held-copy.md
    assert: *citing-records-checks
