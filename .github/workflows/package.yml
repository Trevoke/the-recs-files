name: package

on:
  push:
    branches: [congruence]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package and publish, such as v1.0.0-beta.2; only tags with capability markers and skills/skill-flow.dot can be packaged
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi, agy, opencode]
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the harness CLI
        run: |
          case "${{ matrix.harness }}" in
            claude) npm install -g @anthropic-ai/claude-code ;;
            codex) npm install -g @openai/codex ;;
            pi) npm install -g @earendil-works/pi-coding-agent ;;
            agy) echo "agy has no CLI to install here" ;;
            opencode) npm install -g @opencode/cli ;;
          esac
      - name: Build the package
        run: |
          rm -rf source/packaging
          cp -r tools/packaging source/packaging
          node source/packaging/build.mjs "${{ matrix.harness }}" "$RUNNER_TEMP/package" "${TAG:-0.0.0-dev.${{ github.run_number }}}"
      - name: Test the packaging
        if: matrix.harness == 'claude'
        working-directory: source
        run: |
          node --test 'packaging/test/*.test.mjs'
          node --test 'evals/checks/*.test.mjs'
      - name: Validate the package
        run: source/packaging/validate.sh "${{ matrix.harness }}" "$RUNNER_TEMP/package"

  publish:
    needs: validate
    if: ${{ inputs.tag || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            key: DEPLOY_KEY_CLAUDE
          - harness: codex
            key: DEPLOY_KEY_CODEX
          - harness: pi
            key: DEPLOY_KEY_PI
          - harness: agy
            key: DEPLOY_KEY_AGY
    env:
      REPO: the-recs-files-${{ matrix.harness }}
    steps:
      - name: Refuse a tag that is not a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::$TAG is not a release tag; a release tag starts with v and a digit"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the package
        run: |
          rm -rf source/packaging
          cp -r tools/packaging source/packaging
          node source/packaging/build.mjs "${{ matrix.harness }}" "$RUNNER_TEMP/package" "$TAG"
      - name: Publish it to its repository
        env:
          DEPLOY_KEY: ${{ secrets[matrix.key] }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/key"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone "git@github.com:${{ github.repository_owner }}/$REPO.git" "$RUNNER_TEMP/repo"
          cd "$RUNNER_TEMP/repo"
          git rm -rq --ignore-unmatch .
          cp -a "$RUNNER_TEMP/package/." .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "Release $TAG" -m "Built from ${{ github.server_url }}/${{ github.repository }}/tree/$TAG"
          git tag -f "$TAG"
          git push origin HEAD
          git push -f origin "$TAG"
